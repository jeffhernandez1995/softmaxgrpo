[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "softmaxgrpo"
version = "0.1.0"
description = "Softmax Advantage Group Estimation for verl and ImageNet"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["torch>=2.8,<2.9", "numpy>=1.26,<2"]

[project.optional-dependencies]
data = ["datasets==3.6.0", "math-verify==0.8.0", "rapidfuzz==3.14.1"]
llm = [
  "verl==0.6.1",
  "vllm==0.10.2",
  "transformers==4.56.2",
  "ray[default]==2.48.0",
  "tensordict==0.10.0",
  "torchdata==0.11.0",
  "hydra-core==1.3.2",
  "peft==0.17.1",
  "accelerate==1.10.1",
  "datasets==3.6.0",
  "math-verify==0.8.0",
  "rapidfuzz==3.14.1",
]
imagenet = ["torchvision==0.23.0"]
test = ["pytest>=8,<9", "hydra-core==1.3.2", "build"]

[tool.setuptools.packages.find]
include = ["softmaxgrpo*"]

[tool.setuptools.package-data]
softmaxgrpo = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
