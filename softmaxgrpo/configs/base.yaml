defaults:
  - ppo_trainer
  - _self_

hydra:
  job:
    chdir: false

algorithm:
  adv_estimator: softmaxgrpo
  softmaxgrpo_tau: 0.3
  use_kl_in_reward: false

data:
  train_batch_size: 64
  max_prompt_length: 1024
  max_response_length: 256
  filter_overlong_prompts: true
  truncation: error
  seed: 42

actor_rollout_ref:
  model:
    path: Qwen/Qwen2.5-1.5B
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp
    ppo_mini_batch_size: ${data.train_batch_size}
    ppo_micro_batch_size_per_gpu: 4
    ppo_epochs: 1
    clip_ratio_low: 0.20
    clip_ratio_high: 0.28
    # Disable the extra dual-clip bound: verl clamps likelihood ratios below exp(20).
    clip_ratio_c: 1.0e9
    loss_agg_mode: token-mean
    entropy_coeff: 0.0
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    optim:
      lr: 1.0e-6
      lr_warmup_steps_ratio: 0.0
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  ref:
    log_prob_micro_batch_size_per_gpu: ${actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu}
    fsdp_config:
      param_offload: true
  rollout:
    name: vllm
    mode: sync
    n: 8
    temperature: 1.0
    top_p: 0.999
    top_k: -1
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.5
    log_prob_micro_batch_size_per_gpu: ${actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu}
    val_kwargs:
      n: 1
      do_sample: false
      temperature: 0.0

critic:
  enable: false

reward_model:
  enable: false
  reward_manager: naive

custom_reward_function:
  path: null
  name: compute_score

trainer:
  project_name: softmaxgrpo
  experiment_name: ${experiment}
  logger: [console]
  # verl stops at whichever limit is reached first. Keep epochs above step budgets.
  total_epochs: 10000
  total_training_steps: 1000
  n_gpus_per_node: ${oc.env:GPUS_PER_NODE,8}
  nnodes: ${oc.env:NNODES,1}
  save_freq: 100
  test_freq: 25
  val_before_train: true
  max_actor_ckpt_to_keep: 2
  default_local_dir: ${oc.env:OUTPUT_DIR,outputs}/${experiment}
  validation_data_dir: ${trainer.default_local_dir}/validation

experiment: ???
